name: Static app checks

on:
  push:
    branches: ["main", "migration/replit-exit"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s vercel.json
      - name: Privacy regression guard
        run: |
          ! grep -R "walletconnect\|seed phrase\|private key" -n --exclude-dir=.git index.html app.js styles.css
